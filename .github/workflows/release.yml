name: Release merged changes

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Publish semantic patch release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.repository.default_branch;
            const { data: components } = await github.rest.repos.getContent({ owner, repo, path: "custom_components", ref: branch });
            const componentDirs = components.filter((item) => item.type === "dir");
            if (componentDirs.length !== 1) throw new Error(`Expected one custom component, found ${componentDirs.length}`);
            const manifestPath = `${componentDirs[0].path}/manifest.json`;
            const { data: manifestFile } = await github.rest.repos.getContent({ owner, repo, path: manifestPath, ref: branch });
            if (Array.isArray(manifestFile) || !manifestFile.content) throw new Error(`Could not read ${manifestPath}`);
            const manifest = JSON.parse(Buffer.from(manifestFile.content, "base64").toString("utf8"));
            const parseVersion = (value) => { const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(String(value)); return match ? match.slice(1).map(Number) : null; };
            const compare = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const current = parseVersion(manifest.version);
            if (!current) throw new Error(`Manifest version is not semantic X.Y.Z: ${manifest.version}`);
            const tags = await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 });
            const tagVersions = tags.map((tag) => parseVersion(tag.name)).filter(Boolean).sort(compare);
            const highestTag = tagVersions.length ? tagVersions.at(-1) : [0, 0, 0];
            let releaseVersion = current;
            let releaseSha = context.sha;
            if (compare(current, highestTag) <= 0) {
              const base = compare(current, highestTag) >= 0 ? current : highestTag;
              releaseVersion = [base[0], base[1], base[2] + 1];
              manifest.version = releaseVersion.join(".");
              const { data: updated } = await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: manifestPath,
                branch,
                sha: manifestFile.sha,
                message: `chore: release v${manifest.version} [skip ci]`,
                content: Buffer.from(`${JSON.stringify(manifest, null, 2)}\n`).toString("base64"),
                committer: { name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com" },
              });
              releaseSha = updated.commit.sha;
            }
            const tagName = `v${releaseVersion.join(".")}`;
            if (tags.some((tag) => tag.name === tagName)) {
              core.notice(`${tagName} already exists; no release needed.`);
              return;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tagName}`, sha: releaseSha });
            await github.rest.repos.createRelease({ owner, repo, tag_name: tagName, target_commitish: releaseSha, name: tagName, generate_release_notes: true });
            core.notice(`Published ${tagName}.`);
